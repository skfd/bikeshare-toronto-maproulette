name: Build and Test

# Simple CI for a local workstation tool
# Just ensures the code builds and tests pass - no elaborate infrastructure

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # The weekly sync commits refreshed snapshots; rebuilding on data is noise.
      - 'src/data_results/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual runs

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest  # Match your workstation OS
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # The unattended flags are only exercised by the weekly workflow, which is not
    # run on PRs. A flag landing on the wrong command parses fine locally as the
    # root invocation and then fails in the scheduled run, so check the exact
    # form the workflow uses.
    - name: Check the unattended CLI form parses
      shell: bash
      working-directory: src
      run: |
        output=$(dotnet run --configuration Release --no-build --           run 999999 --yes --commit-baseline 2>&1 || true)
        echo "$output"
        if grep -qi "unrecognized command or argument" <<< "$output"; then
          echo "::error::The scheduled workflow's flags are not accepted by the run command."
          exit 1
        fi

    - name: Summary
      if: success()
      run: echo "✅ Build and tests passed!"
